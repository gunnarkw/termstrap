name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          bash -n install-macos.sh verify-macos.sh
          bash -n install-linux.sh verify-linux.sh
          bash -n bash/.bashrc
      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck install-macos.sh verify-macos.sh install-linux.sh verify-linux.sh
      - name: Zsh syntax
        run: |
          sudo apt-get install -y zsh
          zsh -n zsh/.zshrc zsh/.zprofile
