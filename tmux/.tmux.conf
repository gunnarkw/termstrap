# Shared tmux configuration for macOS and Linux/SSH

# Color support
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Quality of life
set -g mouse on
set -s set-clipboard on
set -g history-limit 50000
set -sg escape-time 0
set -g focus-events on
set -g allow-rename off
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Splits inherit the current pane's working directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Pane navigation without the prefix
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

setw -g mode-keys vi
bind PPage copy-mode -u
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Terminal title
# tmux always captures each pane's shell-set title into #T/#{pane_title};
# set-titles decides whether it re-emits that to the outer terminal. Off by
# default, which is why the outer window/tab title otherwise never updates.
set -g set-titles on
set -g set-titles-string "#T"

# Status bar
set -g status-style bg=colour232,fg=colour255
set -g status-interval 5
set -g status-left-length 50
set -g status-right-length 90
set -g status-left "#[bg=colour39,fg=colour232,bold] #S #[bg=colour114,fg=colour232,bold] #(whoami) #{?client_prefix,#[bg=colour221] K ,}#[bg=colour232] "
set -g status-right "#[fg=colour250] CPU #{cpu_percentage} RAM #{ram_percentage} #[fg=colour244]save:#{continuum_status} #[bg=colour114,fg=colour232,bold] #H #[bg=colour39,fg=colour232,bold] %d %b %H:%M "

setw -g window-status-format "#[fg=colour255] #I:#W "
setw -g window-status-current-format "#[bg=colour39,fg=colour232,bold] #I:#W "
setw -g monitor-activity on
set -g visual-activity off
setw -g window-status-activity-style bg=colour221,fg=colour232
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour39
set -g message-style bg=colour221,fg=colour232,bold

# Plugins (TPM). tmux-sensible is intentionally omitted so behavior remains
# explicit. tmux-yank chooses the appropriate clipboard command per platform.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'laktak/extrakto'
set -g @plugin 'tmux-plugins/tmux-open'

set -g @continuum-restore 'on'

# Load plugins before the final portable copy bindings. tmux-yank selects local
# helpers such as xclip or pbcopy; the overrides below deliberately use tmux's
# native clipboard path so the same keys work locally and over SSH via OSC 52.
run '~/.tmux/plugins/tpm/tpm'

# Keyboard copy in copy mode reaches the terminal clipboard through OSC 52.
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi Y send-keys -X copy-line

# Machine-specific and personal configuration that should survive updates.
if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"
